<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>汉语学习 · HSK Flashcards</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>汉</text></svg>">
</head>
<body>

<!-- ── setup ───────────────────────────────────────────── -->
<main id="setup" class="screen">
  <header class="hero">
    <h1><span class="hanzi-logo">汉语</span> Flashcards</h1>
    <p class="sub">HSK 3.0 (newest) · เลือกคำแปลที่ถูกต้อง</p>
  </header>

  <section class="panel">
    <h2 class="panel-title">ระดับ HSK</h2>
    <div id="levels" class="levels"></div>
    <p id="pool" class="pool">—</p>
  </section>

  <section class="panel">
    <h2 class="panel-title">ตั้งค่า</h2>

    <label class="row">
      <span>จำนวนข้อ</span>
      <select id="qcount">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="0">ทั้งหมด</option>
      </select>
    </label>

    <label class="row">
      <span>โหมดคำถาม</span>
      <select id="mode">
        <option value="hanzi2en">汉字 → คำแปล + พินอิน</option>
        <option value="en2hanzi">คำแปล → 汉字</option>
        <option value="hanzi2py">汉字 → พินอิน</option>
      </select>
    </label>

    <label class="row">
      <span>เรียงลำดับ</span>
      <select id="order">
        <option value="random">สุ่ม</option>
        <option value="freq">ตามความถี่ (ง่าย→ยาก)</option>
      </select>
    </label>

    <label class="row toggle">
      <span>อ่านออกเสียงอัตโนมัติ</span>
      <input type="checkbox" id="autoTTS">
    </label>

    <label class="row toggle">
      <span>ซ่อนพินอินในคำถาม</span>
      <input type="checkbox" id="hidePY" checked>
    </label>
  </section>

  <button id="start" class="btn primary big">เริ่มเลย</button>
  <p id="resume" class="resume hidden"></p>

  <footer class="credits">
    คำศัพท์จาก <a href="https://github.com/drkameleon/complete-hsk-vocabulary" target="_blank" rel="noopener">complete-hsk-vocabulary</a>
    · ประโยคตัวอย่างจาก <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a>
    (<a href="https://creativecommons.org/licenses/by/2.0/fr/" target="_blank" rel="noopener">CC-BY 2.0 FR</a>)
  </footer>
</main>

<!-- ── quiz ────────────────────────────────────────────── -->
<main id="quiz" class="screen hidden">
  <div class="topbar">
    <button id="quit" class="icon-btn" title="ออก">✕</button>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="counter"><span id="idx">1</span>/<span id="total">20</span></div>
  </div>

  <div class="stats">
    <span class="stat ok">✓ <b id="nOK">0</b></span>
    <span class="stat bad">✕ <b id="nBad">0</b></span>
    <span class="stat streak">🔥 <b id="nStreak">0</b></span>
  </div>

  <section class="card">
    <div id="qLevel" class="badge">HSK 1</div>
    <div id="qMain" class="q-main">爱</div>
    <div id="qSub" class="q-sub"></div>
    <button id="speak" class="icon-btn speak" title="ออกเสียง (S)">🔊</button>
  </section>

  <div id="choices" class="choices"></div>

  <div id="feedback" class="feedback hidden">
    <div id="fbText" class="fb-text"></div>

    <div class="reveal">
      <div class="reveal-word">
        <span id="rvHanzi" class="hz"></span>
        <span id="rvPy" class="py"></span>
        <span id="rvRad" class="radical" title="部首 — radical"></span>
      </div>
      <div id="rvEn" class="reveal-en"></div>

      <div id="rvEx" class="example">
        <div class="ex-label">ตัวอย่างประโยค
          <button id="exSpeak" class="icon-btn" title="ออกเสียงประโยค (A)">🔊</button>
        </div>
        <div id="exZh" class="ex-zh"></div>
        <div id="exPy" class="ex-py"></div>
        <div id="exEn" class="ex-en"></div>
      </div>
    </div>

    <button id="next" class="btn primary">ต่อไป →</button>
  </div>

  <!-- กระต่ายให้กำลังใจ -->
  <div id="bunny" class="bunny">
    <div id="bunnyMsg" class="bunny-msg"></div>
    <svg class="bunny-art" viewBox="0 0 120 127" aria-hidden="true">
      <g class="ears">
        <ellipse class="ear-l" cx="45" cy="30" rx="8.5" ry="25"/>
        <ellipse class="ear-l inner" cx="45" cy="32" rx="4" ry="18"/>
        <ellipse class="ear-r" cx="75" cy="30" rx="8.5" ry="25"/>
        <ellipse class="ear-r inner" cx="75" cy="32" rx="4" ry="18"/>
      </g>
      <ellipse class="foot" cx="45" cy="118" rx="9.5" ry="5.5"/>
      <ellipse class="foot" cx="75" cy="118" rx="9.5" ry="5.5"/>
      <ellipse class="fur" cx="60" cy="95" rx="31" ry="25"/>
      <circle class="fur" cx="60" cy="66" r="26"/>
      <ellipse class="blush" cx="41" cy="73" rx="5.5" ry="3.4"/>
      <ellipse class="blush" cx="79" cy="73" rx="5.5" ry="3.4"/>
      <g class="eyes-open">
        <circle class="eye" cx="50" cy="63" r="3.4"/>
        <circle class="eye" cx="70" cy="63" r="3.4"/>
      </g>
      <g class="eyes-happy">
        <path class="eye-line" d="M45.5 64.5q4.5-6 9 0"/>
        <path class="eye-line" d="M65.5 64.5q4.5-6 9 0"/>
      </g>
      <path class="nose" d="M60 70l-4.2 4h8.4z"/>
      <path class="mouth" d="M60 78q-4 4.5-7.5 1M60 78q4 4.5 7.5 1"/>
      <path class="mouth mouth-sad" d="M52.5 81q7.5-5 15 0"/>
    </svg>
  </div>
</main>

<!-- ── result ──────────────────────────────────────────── -->
<main id="result" class="screen hidden">
  <section class="panel score-panel">
    <div id="scoreRing" class="ring"><span id="scorePct">0%</span></div>
    <p id="scoreLine" class="score-line">—</p>
    <div id="resultBunny" class="result-bunny"></div>
    <p id="bunnyVerdict" class="bunny-verdict"></p>
  </section>

  <section class="panel">
    <h2 class="panel-title">คำที่ตอบผิด <span id="wrongCount" class="muted"></span></h2>
    <div id="wrongList" class="wrong-list"></div>
  </section>

  <div class="actions">
    <button id="again" class="btn primary">เล่นอีกครั้ง</button>
    <button id="retryWrong" class="btn">ทบทวนคำที่ผิด</button>
    <button id="home" class="btn ghost">กลับหน้าแรก</button>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
